# Render Blueprint – "New +" → "Blueprint" → pick this repo.
services:
  - type: web
    name: aspire
    runtime: node
    plan: free            # see README "Free vs paid" – free sleeps when idle and loses data on restart
    region: singapore     # closest Render region to the Philippines
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ASPIRE_SECRET
        generateValue: true     # signs login tokens; keep it stable
      - key: ASPIRE_ACCESS_CODE
        sync: false             # optional: set a school access code in the dashboard
      - key: ASPIRE_SCHOOL_PHONE
        sync: false             # optional: school contact number (parent Contact School button)
      - key: SEED_DEMO_INCIDENT
        value: "0"
      - key: ALLOW_DEMO_RESET
        value: "0"              # demo endpoints stay off unless explicitly set to 1
    # For real use (paid plan), uncomment so incidents/roster survive restarts:
    # plan: starter
    # disk:
    #   name: aspire-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and add env var  DATA_DIR = /var/data
